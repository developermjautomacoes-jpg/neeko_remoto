name: NEEKO - Verificar codigo da tela

# Checagem rapida (~10 min) do codigo Flutter, sem compilar o executavel.
on:
  workflow_dispatch:

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  analyze:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: "3.24.5"

      - name: Analyze
        working-directory: flutter
        shell: bash
        run: |
          flutter pub get
          set +e
          dart analyze --format=machine --no-fatal-warnings \
            lib/desktop/pages/neeko_home_page.dart \
            lib/desktop/pages/desktop_home_page.dart \
            lib/common.dart \
            lib/main.dart > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          python3 - <<'PY'
          for line in open('analyze.txt'):
              p = line.strip().split('|')
              if len(p) >= 8 and p[0] in ('ERROR', 'WARNING'):
                  f = p[3].split('/flutter/', 1)[-1]
                  kind = 'error' if p[0] == 'ERROR' else 'warning'
                  msg = '|'.join(p[7:]).replace('%', '%25')
                  print(f"::{kind} file=flutter/{f},line={p[4]},col={p[5]}::{p[2]}: {msg}")
          PY
          exit $code
